    <style>
        /* DEFAULT LIGHT MODE INITIALIZATION */
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc, #e2e8f0);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(15, 23, 42, 0.08);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --header-bg: rgba(255, 255, 255, 0.85);
            --primary-gradient: linear-gradient(135deg, #ff0844, #ffb199, #7928ca);
            --accent-glow: rgba(255, 8, 68, 0.15);
            --inner-card: #ffffff;
            
            --tv-border-gradient: linear-gradient(135deg, #ff007f, #7c3aed, #00f2fe);
            --tv-bg: rgba(15, 23, 42, 0.95);
            --tv-glow: rgba(124, 58, 237, 0.3);

            /* CUSTOM AD BORDER COLORS (Light Mode) */
            --ad-border-gradient: linear-gradient(135deg, #7c3aed, #ff007f);
            --ad-box-shadow: 0 8px 20px rgba(124, 58, 237, 0.15);

            /* BANNER BORDER & GLOW (Light Mode) */
            --banner-border: linear-gradient(135deg, #ff003c, #7c3aed, #00f2fe);
            --banner-glow: 0 10px 30px rgba(255, 0, 60, 0.2);
            --banner-bg: #000000;
        }

        /* DARK MODE STYLES */
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at top, #0f172a, #020617 90%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --header-bg: rgba(15, 23, 42, 0.75);
            --primary-gradient: linear-gradient(135deg, #00f2fe, #4facfe, #9b51e0);
            --accent-glow: rgba(0, 242, 254, 0.3);
            --inner-card: #0b0f19;
            
            --tv-border-gradient: linear-gradient(135deg, #00f2fe, #ff007f, #9b51e0);
            --tv-bg: rgba(2, 6, 23, 0.9);
            --tv-glow: rgba(0, 242, 254, 0.5);

            /* CUSTOM AD BORDER COLORS (Dark Mode) */
            --ad-border-gradient: linear-gradient(135deg, #00f2fe, #ff007f, #9b51e0);
            --ad-box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);

            /* BANNER BORDER & GLOW (Dark Mode) */
            --banner-border: linear-gradient(135deg, #ff003c, #ff007f, #7c3aed);
            --banner-glow: 0 12px 35px rgba(255, 0, 60, 0.45);
            --banner-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s, color 0.3s, transform 0.2s, border-color 0.3s;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            padding: 15px 30px;
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tv-logo-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
        }

        .tv-antenna {
            display: flex;
            gap: 12px;
            margin-bottom: -3px;
            z-index: 2;
        }

        .antenna-left, .antenna-right {
            width: 3px;
            height: 16px;
            background: linear-gradient(to top, #7c3aed, #00f2fe);
            border-radius: 2px;
        }
        .antenna-left { transform: rotate(-30deg); }
        .antenna-right { transform: rotate(30deg); }

        .tv-screen-box {
            position: relative;
            padding: 3px;
            border-radius: 14px;
            background: var(--tv-border-gradient);
            box-shadow: 0 8px 25px var(--tv-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tv-inner-screen {
            background: var(--tv-bg);
            padding: 6px 18px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tv-logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
            filter: drop-shadow(0 2px 4px rgba(255, 255, 255, 0.2));
        }

        .tv-controls-dots {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .tv-dot {
            width: 5px;
            height: 5px;
            background: #475569;
            border-radius: 50%;
        }
        .tv-dot.blue { background: #00f2fe; box-shadow: 0 0 5px #00f2fe; }
        .tv-dot.green { background: #10b981; box-shadow: 0 0 5px #10b981; }
        .tv-dot.red { background: #ff003c; box-shadow: 0 0 8px #ff003c; animation: blink 1s infinite; }

        .subtext {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #7c3aed, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
            margin-left: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-toggle, .live-status {
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .theme-toggle {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .live-status {
            background: linear-gradient(135deg, #ff003c, #ff4d4d);
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
            animation: blink 1.5s infinite;

        .banner-container {
            max-width: 1000px;
            margin: 20px auto 5px;
            padding: 0 25px;
        }

        .banner-wrapper {
            position: relative;
            padding: 3px; 
            border-radius: 16px;
            background: var(--banner-border);
            box-shadow: var(--banner-glow);
            overflow: hidden;
            background-color: var(--banner-bg);

        .banner-wrapper img {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 6.5; 
            object-fit: contain;   
            display: block;
            border-radius: 13px;
            background-color: #000000;

        /* PLAYER CONTAINER */

            padding: 15px 25px 25px;

            border-radius: 24px;

            font-size: 14px;
            font-weight: 500;
            border-top: 1px solid rgba(255, 255, 255, 0.1);

            margin: 15px auto;
            padding: 0 25px;
        }

        .ad-wrapper {
            position: relative;
            padding: 4px;

            background: var(--ad-border-gradient);
            box-shadow: var(--ad-box-shadow);
            overflow: hidden;
        }

        .ad-inner-box {

            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;

        .ad-tag {

            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        /* SEARCH & CATEGORIES */
        .search-filter-section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 25px 20px;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-wrapper input {
            width: 100%;
            padding: 16px 20px 16px 55px;
            border: none;
            outline: none;
            border-radius: 16px;
            font-size: 16px;
            color: var(--text-color);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* CATEGORY SLIDER */
        .category-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
        }

        .category-container::-webkit-scrollbar {
            height: 5px;
        }
        .category-container::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 10px;
        }

        .category-btn {
            padding: 10px 22px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .category-btn.active_cat, .category-btn:hover {
            background: linear-gradient(135deg, #00f2fe, #7c3aed);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        /* CHANNEL GRID */
        .channel-grid-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 25px 50px;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 25px;
        }

        .channel {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .channel::before {
            content: '';
            position: absolute;
            width: 106%;
            height: 106%;
            border-radius: 50%;
            background: conic-gradient(#00f2fe, #ff007f, #7c3aed, #00f2fe);
            animation: spin 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .channel:hover::before, .channel.active::before {
            opacity: 1;
        }

        .channel::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--inner-card);
            border-radius: 50%;
        }

        .channel img {
            position: relative;
            z-index: 2;
            width: 75%;
            height: 75%;
            object-fit: contain;
            border-radius: 50%;
            padding: 5px;
            background: transparent;
        }

        .channel .fallback-icon {
            position: relative;
            z-index: 2;
            font-size: 36px;
            color: var(--text-muted);
        }

        .channel-name {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            color: #ffffff;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .channel.active {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        /* FOOTER */
        .footer {
            padding: 35px;
            text-align: center;
            background: var(--header-bg);
            border-top: 1px solid var(--card-border);
        }

        .footer h2 {
            font-size: 28px;
            background: linear-gradient(90deg, #00f2fe, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .footer p {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* FLOATING DRAGGABLE APP DOWNLOAD BUTTON */
        #draggableAppBtn {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #ff003c, #cc0029);
            color: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;

            transition: transform 0.1s ease, box-shadow 0.3s ease;
        }

        #draggableAppBtn:hover {
            box-shadow: 0 12px 30px rgba(255, 0, 60, 0.7);
        }

        #draggableAppBtn i {
            font-size: 20px;

        }

        #draggableAppBtn span {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 11px;
            padding: 0 4px;
        }

        /* RESPONSIVE DESIGN */
        @media(max-width: 768px) {
            video { height: 160px; } 
            .header { padding: 10px 15px; }
            .top-bar { gap: 8px; }
            .channel-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }

            .subtext { font-size: 9px; margin-top: 2px; margin-left: 2px; }

                width: 60px;

        }
    </style>

    <script>
        const playlistUrl = 'aynaott.m3u';
        
        let channels = [];
        let filteredChannels = [];
        let categories = new Set(['All']); 
        let currentIndex = 0;
        let selectedCategory = 'All';
        let hls;

        const video = document.getElementById('video');

        // THEME TOGGLE
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            
            const btn = document.getElementById('themeBtn');
            if(newTheme === 'light') {
                btn.innerHTML = `<i class="fa-solid fa-moon"></i> Dark`;
            } else {
                btn.innerHTML = `<i class="fa-solid fa-sun"></i> Light`;
            }
        }

        // FETCH PLAYLIST WITH CATEGORIES
        fetch(playlistUrl)
            .then(res => res.text())
            .then(data => {
                const lines = data.split('\n');
                let tempChannels = [];
                let categoryMap = {}; 

                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        const info = lines[i];
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        const name = info.split(',')[1] ? info.split(',')[1].trim() : 'Unknown Channel';
                        
                        let logo = '';
                        const logoMatch = info.match(/tvg-logo="(.*?)"/);
                        if (logoMatch) logo = logoMatch[1];

                        let category = 'Uncategorized';
                        const groupMatch = info.match(/group-title="(.*?)"/);
                        
                        if (groupMatch && groupMatch[1]) {
                            let originalCat = groupMatch[1].trim();
                            let lowerCat = originalCat.toLowerCase();
                            
                            if (!categoryMap[lowerCat]) {
                                categoryMap[lowerCat] = originalCat;
                            }
                            category = categoryMap[lowerCat];
                        }
                        
                        if(category !== 'All') {
                            categories.add(category);
                        }

                        if(url) {
                            tempChannels.push({ name, url, logo, category });
                        }
                    }
                }
                
                let priorityChannels = [];
                let remainingChannels = [];

                tempChannels.forEach(ch => {
                    const channelName = ch.name.toLowerCase();
                    if (channelName.includes('t sports') || channelName.includes('ptv sports')) {
                        priorityChannels.push(ch);
                    } else {
                        remainingChannels.push(ch);
                    }
                });

                priorityChannels.sort((a, b) => {
                    const nameA = a.name.toLowerCase();
                    if (nameA.includes('t sports')) return -1;
                    if (nameA.includes('ptv sports')) return 1;
                    return 0;
                });

                channels = [...priorityChannels, ...remainingChannels];
                filteredChannels = [...channels];
                
                renderCategories();
                renderChannels();
                if (channels.length > 0) playChannel(0);
            });

        // RENDER CATEGORIES
        function renderCategories() {
            const container = document.getElementById('categoryCapsules');
            container.innerHTML = `<button class="category-btn active_cat" id="cat-All" onclick="selectCategory('All')">All Channels</button>`;
            
            categories.forEach(cat => {
                if(cat !== 'All') {
                    const btn = document.createElement('button');
                    btn.className = 'category-btn';
                    btn.id = `cat-${cat.replace(/\s+/g, '-')}`;
                    btn.textContent = cat;
                    btn.onclick = () => selectCategory(cat);
                    container.appendChild(btn);
                }
            });
        }

        // SELECT CATEGORY
        function selectCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active_cat'));
            
            const activeID = `cat-${cat.replace(/\s+/g, '-')}`;
            if(document.getElementById(activeID)) {
                document.getElementById(activeID).classList.add('active_cat');
            }

            filterChannels();
        }

        // FILTER CHANNELS
        function filterChannels() {
            const searchInput = document.getElementById('search').value.toLowerCase();
            
            filteredChannels = channels.filter(ch => {
                const matchCat = (selectedCategory === 'All' || ch.category.toLowerCase() === selectedCategory.toLowerCase());
                const matchSearch = ch.name.toLowerCase().includes(searchInput);
                return matchCat && matchSearch;
            });

            renderChannels();
        }

        // RENDER CHANNELS
        function renderChannels() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            filteredChannels.forEach((ch, index) => {
                const div = document.createElement('div');
                div.className = 'channel';
                
                const logoImg = ch.logo ? `<img src="${ch.logo}" alt="${ch.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : '';
                const fallback = `<i class="fa-solid fa-tv fallback-icon" style="${ch.logo ? 'display:none;' : 'display:block;'}"></i>`;
                
                div.innerHTML = `
                    ${logoImg}
                    ${fallback}
                    <div class="channel-name">${ch.name}</div>
                `;
                
                const actualGlobalIndex = channels.findIndex(globalCh => globalCh.url === ch.url);
                if (actualGlobalIndex === currentIndex) div.classList.add('active');

                div.onclick = () => playChannel(actualGlobalIndex);
                grid.appendChild(div);
            });
        }

        // PLAY CHANNEL
        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentIndex = index;
            const channel = channels[index];

            document.getElementById('currentPlayingName').innerText = `Playing: ${channel.name}`;

            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.play();
            }

            document.querySelectorAll('.channel').forEach(el => el.classList.remove('active'));
            renderChannels(); 
        }

        // DRAG AND DROP LOGIC
        const dragBtn = document.getElementById("draggableAppBtn");
        let isDragging = false;
        let startX, startY, initialX, initialY;
        let hasMoved = false;

        function startDrag(e) {
            isDragging = true;
            hasMoved = false;
            
            const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
            
            startX = clientX;
            startY = clientY;
            
            const rect = dragBtn.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            
            dragBtn.style.right = 'auto';
            dragBtn.style.bottom = 'auto';
            dragBtn.style.left = initialX + 'px';
            dragBtn.style.top = initialY + 'px';
        }

        function doDrag(e) {
            if (!isDragging) return;
            
            const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
            
            const dx = clientX - startX;
            const dy = clientY - startY;
            
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                hasMoved = true;
            }

            let newLeft = initialX + dx;
            let newTop = initialY + dy;

            const padding = 10;
            newLeft = Math.max(padding, Math.min(newLeft, window.innerWidth - dragBtn.offsetWidth - padding));
            newTop = Math.max(padding, Math.min(newTop, window.innerHeight - dragBtn.offsetHeight - padding));

            dragBtn.style.left = newLeft + "px";
            dragBtn.style.top = newTop + "px";
        }

        function endDrag(e) {
            isDragging = false;
            if (hasMoved) {
                e.preventDefault();
            }
        }

        dragBtn.addEventListener("mousedown", startDrag);
        window.addEventListener("mousemove", doDrag);
        window.addEventListener("mouseup", endDrag);

        dragBtn.addEventListener("touchstart", startDrag, { passive: true });
        window.addEventListener("touchmove", doDrag, { passive: false });
        window.addEventListener("touchend", endDrag);

        dragBtn.addEventListener("click", function(e) {
            if (hasMoved) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
